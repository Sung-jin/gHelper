# 습격 OCR 캡처 전용 EXE 빌드. Python 없이 실행 가능.
# Tesseract + 한글 데이터는 사용자 PC에 별도 설치 필요.
name: Build RaidOcr EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r engine/tools/capture/requirements.txt

      - name: Build RaidOcr EXE
        shell: pwsh
        working-directory: engine/tools/capture
        run: |
          pyinstaller --onefile --name "RaidOcr" --clean raid_ocr.py
          New-Item -ItemType Directory -Force -Path "out"
          Copy-Item "dist/RaidOcr.exe" -Destination "out/"
          if (Test-Path "raid_ocr_config.example.json") {
            Copy-Item "raid_ocr_config.example.json" -Destination "out/raid_ocr_config.example.json"
          }
          Write-Host "배포용 패키지 준비 완료 (out 폴더)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidOcr-Release-Package
          path: engine/tools/capture/out/*
